{% extends 'login/layout.html' %}

{% load static %}

{% block title %}Welcome to Tennis Circle{% endblock %}

{% block body %}

<div class="content centered">

    <form method="post">
        {% csrf_token %}
        <div class="space"></div>
        <img src="{% static 'login/logo.png' %}" class="logo centered">
        <div class="space"></div>
        <div class="space"></div>
        <p class="welcome">Welcome</p>
        <div class="space"></div>
        <div class="space"></div>
        <div class="fields centered">
            <input type="text" name="username" placeholder="Username" class="field centered">
            <div class="space"></div>
            <div class="space"></div>
            <input type="password" name="password" placeholder="Password" class="field centered">
            <div class="space"></div>
            <div class="space"></div>
            <input type="submit" value="Sign In" class="field centered">
        </div>
        <div class="space"></div>
        <div class="space"></div>
        <div class="fields centered">
            <p class="message">Don't have a Tennis Circle account? <a href="{% url 'login:signup' %}">Create one</a>.</p>
        </div>
    </form>

</div>

{% if error_message %}

    <div class="fields centered">
        <div class="space"></div>
        <p class="message error">{{ error_message }}</p>
    </div>

{% endif %}

{% endblock %}
