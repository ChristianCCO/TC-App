{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{% block title %}{% endblock %}</title>
        <link rel="stylesheet" href="{% static 'home/styles.css' %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <link rel="icon" type="image/x-icon" href="{% static 'home/favicon.png' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% block head %}
        {% endblock %}
    </head>
    <body>
        <div class="container-fluid">

            <div class="nav-bar row">
                <div class="col"></div>
                <div class="col-8">
                    <div id="logo" class="links"><a href="{% url 'home:index' %}"><img src="{% static 'home/favicon.png' %}" class="logo"></a></div>
                    <div class="links"><a href="{% url 'circle:index' %}" class="link">Your Circle</a></div>
                    <div class="links"><a href="{% url 'player:index' %}" class="link">Profile</a></div>
                </div>
                <div class="col"></div>
            </div>

            <div class="content row">
                <div class="col"></div>
                <div class="col-8">
                    <div class="space"></div>
                    <div class="space"></div>
                    {% block body %}
                    {% endblock %}
                </div>
                <div class="col"></div>
            </div>

        </div>
    </body>
</html>
